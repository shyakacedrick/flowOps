# Render Infrastructure-as-Code blueprint.
#
# Lets you spin up the whole backend stack from this repo with one click
# at https://dashboard.render.com/select-repo (click "New Blueprint").
# Render reads this file, creates the service, sets env-var placeholders,
# and links them to the GitHub repo so every push to `main` auto-deploys.
#
# Free tier specifics:
#   - 750 instance-hours / month (1 always-on service fits easily)
#   - Service sleeps after 15 minutes of inactivity (~30s cold start)
#   - 512 MB RAM, 0.1 CPU
#   - Free TLS on *.onrender.com
#   - No credit card required
#
# Sync = false on secrets so they NEVER get committed; you fill them in
# the Render dashboard after the blueprint is applied.
services:
  - type: web
    name: flowops-backend
    runtime: docker
    plan: free
    region: oregon              # frankfurt | singapore | ohio | virginia also available
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true            # redeploy on every push to the tracked branch
    branch: main
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: API_PREFIX
        value: /api

      # ── Secrets (set these in the Render dashboard) ──────────────────
      - key: MONGO_URI
        sync: false             # your existing Atlas connection string
      - key: JWT_SECRET
        generateValue: true     # Render will generate a 256-bit random value

      # ── Auth tuning ──────────────────────────────────────────────────
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 30d
      - key: BCRYPT_SALT_ROUNDS
        value: "10"
      - key: REFRESH_COOKIE_NAME
        value: flowops_refresh

      # ── CORS — fill with your Netlify URL after the frontend deploys ─
      - key: CORS_ORIGINS
        sync: false             # e.g. https://flowops.netlify.app

      # ── App URL — used in email links ────────────────────────────────
      - key: APP_URL
        sync: false             # same value as CORS_ORIGINS

      # ── Logging ──────────────────────────────────────────────────────
      - key: LOG_LEVEL
        value: info

      # ── Email (skipped — falls back to console logs in Render's tail) ─
      # Add RESEND_API_KEY or SMTP_HOST later when you wire mail.
      - key: MAIL_FROM
        value: FlowOps <noreply@flowops.local>
      - key: EMAIL_VERIFY_TTL_HOURS
        value: "24"
      - key: PASSWORD_RESET_TTL_MINS
        value: "60"
