# CI: lint + test on every PR and on pushes to main.
#
# Backend uses an in-process MongoDB (mongodb-memory-server) so we don't
# need a service container for tests. Frontend now has hook tests under
# vitest + jsdom (Phase 15.2 shipped 2026-06-24).
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: backend (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Syntax check
        run: |
          # Quick parse check across all source files so lint failures
          # don't have to wait for the test phase.
          find src -name "*.js" -print0 | xargs -0 -n1 node --check

      - name: Run tests
        run: npm test

  frontend:
    name: frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit + hook tests
        run: npm test

      - name: Build
        run: npm run build
